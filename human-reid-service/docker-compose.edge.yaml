services:
  # ---------------------------------------------------------------------------
  # Local Database (Edge)
  # Lightweight database running pgvector locally on the Edge node.
  # Used by the local human-reid service for offline/local vector matching.
  # ---------------------------------------------------------------------------
  edge-db:
    image: pgvector/pgvector:pg16
    container_name: alpha-edge-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${EDGE_DB_PASSWORD:-local_secure_password}
      - POSTGRES_DB=reid_local
    volumes:
      - edge_db_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Human Re-ID Service (Edge)
  # Computes and matches 512-dim face/body embeddings for the vision service.
  # ---------------------------------------------------------------------------
  human-reid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha-edge-human-reid
    env_file:
      - ./.env
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://postgres:${EDGE_DB_PASSWORD:-local_secure_password}@edge-db:5432/reid_local
      - DB_CONNECT_TIMEOUT_SECONDS=5
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
    depends_on:
      - edge-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vision Inference Service (Edge)
  # Connects to RTSP cameras, executes YOLO pipelines, calls Re-ID on port 8001,
  # and pushes violation alerts outbound to the Cloud API.
  # ---------------------------------------------------------------------------
  vision-inference:
    build:
      context: ../vision-inference-service
      dockerfile: Dockerfile
    container_name: alpha-edge-vision-inference
    ports:
      - "8000:8000"
    env_file:
      - ../vision-inference-service/.env
    environment:
      - PORT=8000
      # Local endpoint of the edge human-reid container (resolves over Docker bridge)
      - HUMAN_REID_URL=http://human-reid:8001
    volumes:
      - dlq_data:/data
    depends_on:
      - human-reid
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  edge_db_data: # Persists local face embeddings
  dlq_data: # Persists unsent offline violations
