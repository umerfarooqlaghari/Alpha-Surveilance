name: Build and Push Multi-Arch Edge Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check-build-switch:
    name: Check Build Switch (docker-compose.prod.yaml)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.parse_switch.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse build_images switch
        id: parse_switch
        run: |
          BUILD_SETTING=$(grep -i "build_images:" docker-compose.prod.yaml | head -n1 | awk '{print $2}' | tr -d '"' | tr -d "'" | tr '[:upper:]' '[:lower:]')
          if [ "$BUILD_SETTING" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Docker image builds are ENABLED in docker-compose.prod.yaml"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ Docker image builds are DISABLED in docker-compose.prod.yaml"
          fi

  build-and-push-vision:
    name: Build & Push Vision Inference Service
    needs: check-build-switch
    if: needs.check-build-switch.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch linux/arm64 & linux/amd64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Vision Service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/alpha-vision
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Vision Inference multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./vision-inference-service
          file: ./vision-inference-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vision-inference
          cache-to: type=gha,mode=max,scope=vision-inference

  build-and-push-human-reid:
    name: Build & Push Human Re-ID Service
    needs: check-build-switch
    if: needs.check-build-switch.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch linux/arm64 & linux/amd64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Human Re-ID Service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/alpha-human-reid
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Human Re-ID multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./human-reid-service
          file: ./human-reid-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=human-reid
          cache-to: type=gha,mode=max,scope=human-reid
